[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.0.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/amritghimire/plantool"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
similar = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
which = "7"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio-tungstenite = "0.26"
rust-embed = { version = "8", features = ["include-exclude", "interpolate-folder-path"] }
open = "5"
dirs = "6"
regex = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
