[project]
name = "plantool-worker"
version = "0.1.0a1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["datamodel-code-generator==0.35.0", "pytest>=8,<9", "pytest-asyncio>=0.25,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.uv]
package = false
