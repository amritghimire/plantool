[package]
name = "plantool-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
libc = "0.2"
shlex = "2"
base64 = "0.22"
tempfile = "3"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2.workspace = true
percent-encoding = "2"
# Keep the standalone release binary independent of a system OpenSSL installation.
openssl = { version = "0.10", features = ["vendored"] }
plantool-core = { path = "../core" }
plantool-contract = { path = "../contract" }
serde_yaml = "0.9"
flate2 = "1"
tar = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
uuid.workspace = true
which.workspace = true
futures.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[test]]
name = "e2e_github"
path = "../../tests/e2e_github/github.rs"
