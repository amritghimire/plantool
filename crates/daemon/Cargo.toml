[package]
name = "plantool-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2.workspace = true
percent-encoding = "2"
# Keep the standalone release binary independent of a system OpenSSL installation.
openssl = { version = "0.10", features = ["vendored"] }
plantool-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
uuid.workspace = true
which.workspace = true
futures.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
